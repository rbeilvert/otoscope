name: Checks

on:
  pull_request:
    branches: [main]
  # setup-gradle writes its cache only from the default branch (PR runs restore
  # read-only). Without a push trigger the cache is never seeded, so every PR
  # build re-downloads the whole toolchain. This is what makes caching work.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Build and lint share one job on purpose: setup-gradle keys its cache per
  # workflow *and* job, so splitting them would mean two cache entries and two
  # cold restores instead of one warm Gradle home.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-cleanup: on-success

      - name: Build debug APK
        # Gradle's build cache is enabled in gradle.properties.
        run: ./gradlew assembleDebug

      - name: Upload APK
        # Only PR runs produce an artifact worth downloading; the push run exists
        # to seed the cache.
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: otoscope-debug-${{ github.event.pull_request.head.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Android Lint (release variant)
        # After the upload so a lint failure still leaves reviewers an APK to
        # install. The step failing still fails the job.
        run: ./gradlew lintRelease

      - name: Upload lint report
        # Lint prints the first failure inline, but the HTML report is what you
        # actually want when a run goes red.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-results-release
          path: |
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.sarif
          if-no-files-found: warn
