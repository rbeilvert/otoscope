name: Checks

on:
  pull_request:
    branches: [main]
  # setup-gradle writes its cache only from the default branch (PR runs restore
  # read-only). Without a push trigger the cache is never seeded, so every PR
  # build re-downloads the whole toolchain. This is what makes caching work.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Build and lint share one job on purpose: setup-gradle keys its cache per
  # workflow *and* job, so splitting them would mean two cache entries and two
  # cold restores instead of one warm Gradle home.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-cleanup: on-success

      - name: Build debug APK
        # Gradle's build cache is enabled in gradle.properties.
        run: ./gradlew assembleDebug

      - name: Upload APK
        # Only PR runs produce an artifact worth downloading; the push run exists
        # to seed the cache.
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: otoscope-debug-${{ github.event.pull_request.head.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Unit tests
        # Regression floor for the camera-protocol parsers (frame assemblers, RTSP client,
        # BLE advert parsers, etc.). Runs on the local JVM, with no emulator.
        id: tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload test report
        if: always() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

      - name: Android Lint (release variant)
        # After the APK upload and tests so a lint or test failure still
        # leaves reviewers an APK to install, and both check signals surface
        # on the same run (a test failure shouldn't hide a lint regression).
        if: success() || failure()
        run: ./gradlew lintRelease

      - name: Upload lint report
        # Lint prints the first failure inline, but the HTML report is what you
        # actually want when a run goes red.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-results-release
          path: |
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.sarif
          if-no-files-found: warn
